services:
  postgres:
    image: postgres:17
    container_name: tpo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-tpo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-tpo}
      POSTGRES_DB: ${PG_DATABASE:-tpo_facturacion}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-tpo} -d ${PG_DATABASE:-tpo_facturacion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:8
    container_name: tpo-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tpo_facturacion}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      # Context is the repo root so the image can include the sql/ query files.
      context: .
      dockerfile: api/Dockerfile
    container_name: tpo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      # Inside the compose network the databases are reached by service name on
      # their container ports (not the host-mapped ports).
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${PG_USER:-tpo}
      PG_PASSWORD: ${PG_PASSWORD:-tpo}
      PG_DATABASE: ${PG_DATABASE:-tpo_facturacion}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DATABASE: ${MONGO_DATABASE:-tpo_facturacion}
      API_PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  postgres_data:
  mongo_data:
