services:
  postgres:
    image: postgres:17
    container_name: tpo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-tpo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-tpo}
      POSTGRES_DB: ${PG_DATABASE:-tpo_facturacion}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-tpo} -d ${PG_DATABASE:-tpo_facturacion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
