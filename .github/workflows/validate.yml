name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-sql:
    name: Lint SQL (sqlfluff, postgres dialect)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sqlfluff
        run: pip install "sqlfluff>=3,<4"

      - name: Lint
        run: sqlfluff lint sql/

  build-api:
    name: Build and test API (NestJS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

  integration-test:
    name: Integration Test (Postgres + MongoDB)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tpo
          POSTGRES_PASSWORD: tpo
          POSTGRES_DB: tpo_facturacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install

      - name: Apply SQL files in order
        env:
          PGPASSWORD: tpo
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: tpo
          PGDATABASE: tpo_facturacion
        run: |
          shopt -s nullglob
          for f in sql/*.sql; do
            echo "::group::Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Apply Mongo scripts in order
        env:
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DATABASE: tpo_facturacion
          PGPASSWORD: tpo
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: tpo
          PGDATABASE: tpo_facturacion
        run: |
          shopt -s nullglob
          for f in nosql/*.ts nosql/queries/*.ts; do
            echo "::group::Applying $f"
            bun run "$f"
            echo "::endgroup::"
          done

      - name: Verify expected state after seed
        env:
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DATABASE: tpo_facturacion
          PGPASSWORD: tpo
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: tpo
          PGDATABASE: tpo_facturacion
        run: bun run scripts/ci-verify-mongo.ts
